<script>
// ===== CONFIG =====

const cv=document.getElementById("c"),ctx=cv.getContext("2d"),scan=document.getElementById("scan");
let cw=0,ch=0,s=1,ox=0,oy=0,dpr=1;
function fit(){dpr=Math.min(2,window.devicePixelRatio||1);cw=innerWidth;ch=innerHeight;cv.width=cw*dpr;cv.height=ch*dpr;s=Math.min(cw/LW,ch/LH);ox=(cw-LW*s)/2;oy=(ch-LH*s)/2;}
addEventListener("resize",fit);fit();cv.focus();

// ===== AUDIO =====
let ac=null,mute=false,mTimer=null,st=0,vol=.7,volI=1;try{const v=localStorage.getItem("ppVol");if(v!==null&&+v>=0&&+v<=2){volI=+v;vol=[.35,.7,1][volI];}}catch(e){}
addEventListener("touchend",()=>{if(ac&&ac.state!=="running")ac.resume().catch(()=>{});});
function A(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){}return ac;}
function beep(f,d=.08,t="square",v=.05){if(mute)return;const c=A();if(!c)return;const o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v*vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d);}
const BASS=[110,0,110,0,131,0,131,0,98,0,98,0,147,0,165,0],ARP=[440,0,523,0,659,0,523,0,392,0,494,0,587,0,494,0];
function noise(d,v){if(mute)return;const c=A();if(!c)return;const n=c.sampleRate*d|0,bf=c.createBuffer(1,n,c.sampleRate),a=bf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const o=c.createBufferSource(),g=c.createGain();o.buffer=bf;g.gain.value=v*vol;o.connect(g);g.connect(c.destination);o.start();}
function cycleVol(){if(mute){mute=false;volI=0;}else if(volI<2)volI++;else mute=true;vol=[.35,.7,1][volI];try{localStorage.setItem("ppVol",volI);}catch(e){}beep(660,.08);}
function music(){const tick=()=>{if(!mute&&!paused&&state==="play"){const i=st%16,m=combo>=10?1.5:1;if(BASS[i])beep(BASS[i]*m,.16,"square",.045);if(ARP[i]&&(st>>4)%2===1)beep(ARP[i]*m*(ev?1.19:1),.08,"triangle",.03);if(i%4===0)noise(.06,.05);if(i%2===1&&combo>=5)noise(.03,.025);st++;}mTimer=setTimeout(tick,Math.max(80,135-Math.min(combo,20)*2-(ev?15:0)));};tick();}

// ===== INPUT =====
const keys={};let state="menu",sel=1,paused=false,mouseY=null,ptr={x:-1,y:-1},ui=[];
function lp(e){return{x:(e.clientX-ox)/s,y:(e.clientY-oy)/s};}
addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","Space","Enter","NumpadEnter"].includes(e.code))e.preventDefault();const f=!keys[e.code];keys[e.code]=true;if(f)press(e.code);});
addEventListener("keyup",e=>{keys[e.code]=false;});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;if(state==="play")paused=true;});
const isGo=c=>c==="Enter"||c==="NumpadEnter"||c==="Space";
function toMenu(){state="menu";paused=false;beep(220,.1);}
function press(c){
 if(c==="KeyM")mute=!mute;
 if(c==="KeyC")scan.style.display=scan.style.display==="none"?"block":"none";
 
 if(state==="menu"){if(isGo(c))start();if(c==="KeyD"||c==="ArrowRight")sel=(sel+1)%3;if(c==="ArrowLeft")sel=(sel+2)%3;if(c==="KeyH")state="how";if(c==="KeyS")openSkins();if(c==="KeyT")state="trophies";}
 else if(state==="skins"){if(c==="ArrowRight"||c==="KeyD")go(1);else if(c==="ArrowLeft"||c==="KeyA")go(-1);else if(isGo(c))pick();else if(c==="Escape"||c==="KeyQ")state="menu";else if(c==="KeyT")state="trophies";}
 else if(state==="trophies"){if(c==="Escape"||c==="KeyQ"||isGo(c))state="menu";else if(c==="KeyS")openSkins();}
 else if(state==="how"){if(isGo(c)||c==="Escape"||c==="KeyQ")state="menu";}
 else if(state==="over"){if(isGo(c))start();if(c==="Escape"||c==="KeyQ")toMenu();}
 else if(state==="play"){if(c==="KeyQ")toMenu();else if(c==="Escape"||c==="KeyP")paused=!paused;else if(c==="Space"){paused?paused=false:nudge();}}
}
let uiPtr=-1;

cv.addEventListener("pointerdown",e=>{cv.focus();ptr=lp(e);A();

 mouseY=ptr.y;});
addEventListener("pointerup",e=>{if(e.pointerId===uiPtr)uiPtr=-1;});addEventListener("pointercancel",e=>{if(e.pointerId===uiPtr)uiPtr=-1;});

// ===== GAME STATE =====
let two=false,extras=[],hs=0,slow=0,big={p:0,c:0},lastHit="p",ev=null,evCd=30;
let tiltLock=0,bmT=900,frz=0,mag=0,shield=0,blaze=0,jack=0,view=0,carPos=0,toasts=[];
const SK=[{n:"CLASSIC",ab:"SHOCKWAVE",d:"Flips an incoming ball 180°",c:G,cost:0},{n:"FROST",ab:"FREEZE",d:"Slows the ball for 2s",c:"#7ab8ff",cost:150,ach:"c10"},{n:"MAGNET",ab:"MAGNET",d:"Pulls the ball to your paddle",c:"#ff4fd8",cost:300,ach:"c15"},{n:"SHIELD",ab:"SHIELD",d:"Goal wall blocks one miss",c:"#b07aff",cost:500,ach:"hard"},{n:"TITAN",ab:"GROW",d:"Paddle grows huge for 5s",c:"#3ff5ff",cost:250,ach:"use20"},{n:"INFERNO",ab:"BLAZE",d:"Next return flies at rocket speed",c:"#ff7a1a",cost:700,ach:"c25"},{n:"GOLD",ab:"JACKPOT",d:"Double combo gains for 6s",c:"#ffe066",cost:900,ach:"rich"},{n:"VOID",ab:"TIMEWARP",d:"Slows time for 3s",c:"#ffffff",cost:1400,ach:"perf"}];

let sv={coins:0,own:[0],skin:0,ach:{},uses:0};try{Object.assign(sv,JSON.parse(localStorage.getItem("ppSave")||"{}"));}catch(e){}

let tip="",tipT=0;function showTip(id,t){sv.tips=sv.tips||{};if(sv.tips[id])return;sv.tips[id]=1;tip=t;tipT=4;save();}
function earn(n){sv.coins+=n;if(sv.coins>=500)grant("rich");save();}
function grant(id){if(sv.ach[id])return;const a=ACH.find(x=>x.id===id);if(!a)return;sv.ach[id]=1;sv.coins+=50;toasts.push({s:"TROPHY: "+a.n+"  +50 COINS",u:performance.now()+3800});SK.forEach((k,i)=>{if(k.ach===id&&!sv.own.includes(i)){sv.own.push(i);toasts.push({s:"SKIN UNLOCKED: "+k.n,u:performance.now()+4200});}});if(sv.own.length>=SK.length&&id!=="all")grant("all");beep(1000,.2,"triangle",.08);save();}
function drawToasts(){const n=performance.now();toasts=toasts.filter(o=>o.u>n);toasts.forEach((o,i)=>{const y=140+i*46;ctx.fillStyle="rgba(0,20,6,.92)";ctx.fillRect(250,y,460,38);ctx.strokeStyle=AMB;ctx.lineWidth=2;ctx.strokeRect(250,y,460,38);txt(o.s,480,y+20,20,AMB);});}

function go(d){view=Math.max(0,Math.min(SK.length-1,view+d));beep(500,.05);}
function pick(){const k=SK[view],i=view;if(sv.own.includes(i)){skin=sv.skin=i;save();beep(660,.08);}else if(sv.coins>=k.cost){sv.coins-=k.cost;sv.own.push(i);skin=sv.skin=i;save();grant("shop");beep(880,.2,"triangle");}else{beep(120,.2,"sawtooth");toasts.push({s:"NEED "+(k.cost-sv.coins)+" MORE COINS",u:performance.now()+1800});}}
function panel(){ctx.fillStyle="rgba(0,12,4,.8)";ctx.fillRect(30,24,900,552);glow(G,14);ctx.strokeStyle=G;ctx.lineWidth=3;ctx.strokeRect(30,24,900,552);noglow();}
function paddleFx(i,x,y,w,h,own,hot,px){
 const T=performance.now()/1000,P5=px||5,rows=Math.max(8,Math.round(h/P5)),L=Math.round(x-2*P5),U=Math.round(y-rows*P5/2),F=Math.floor(T*8),R=Math.floor(T*20);
 ctx.shadowBlur=0;
 const q=(c,r,col)=>{ctx.fillStyle=col;ctx.fillRect(L+Math.round(c)*P5,U+Math.round(r)*P5,P5,P5);};
 const hc=n=>["#ff3030","#ff9a1a","#ffe84a","#3aff6a","#3affea","#4a6aff","#c04aff","#ff4ad8"][((n%8)+8)%8];
 if(!own){for(let r=0;r<rows;r++)for(let c=0;c<4;c++)q(c,r,(r+c)%2?"#2c2c2c":"#3a3a3a");return;}
 const W4=["#fff","#fff","#fff","#fff"];
 for(let r=0;r<rows;r++){const t=r/rows;let cs=[G,G,G,G];
  if(i===0){cs=[G,"#b8ffcb","#b8ffcb",G];if(r===(F*2)%rows)cs=W4;}
  else if(i===1){cs=r%2?["#2a5ccf","#9fd4ff","#e8f4ff","#2a5ccf"]:["#4a8cff","#bfe4ff","#ffffff","#4a8cff"];
   if(r%4===1){q(-1,r,"#bfe4ff");q(4,r,"#bfe4ff");}if(r%8===2)q(-2,r,"#fff");if(r%8===6)q(5,r,"#fff");if((r*7+R)%23===0)cs=W4;}
  else if(i===2){cs=(r+Math.floor(T*6))%4<2?["#a0189a","#ff4fd8","#ff4fd8","#a0189a"]:["#6a0a66","#c030a8","#c030a8","#6a0a66"];
   if(r<3){q(4,r,"#ff3030");q(5,r,"#ff3030");}if(r>=rows-3){q(4,r,"#3a6aff");q(5,r,"#3a6aff");}if(r%6===3&&F%2)q(6,r,"#ffd6f6");}
  else if(i===3){cs=r%4===3?["#2a0a5a","#2a0a5a","#2a0a5a","#2a0a5a"]:["#7a4ad8","#e8d4ff","#b07aff","#7a4ad8"];if(r%4!==3&&(r===(F*2)%rows||r===(F*2+1)%rows))cs=W4;}
  else if(i===4){const pl=Math.floor(T*4)%2;cs=["#0a8a9a",pl?"#d8ffff":"#3ff5ff",pl?"#3ff5ff":"#d8ffff","#0a8a9a"];if(r%3===0){cs[0]="#05303a";cs[3]="#05303a";}}
  else if(i===5){const bd=t<.33?["#ffec8a","#fff6b0"]:t<.66?["#ff7a1a","#ffb040"]:["#c11a00","#ff4a10"];cs=[bd[1],bd[0],bd[0],bd[1]];
   const len=1+((Math.sin(T*14+r*1.9)+1.2)*1.4|0);for(let k=1;k<=len;k++)q(-k,r,k>len/2?"#ff7a1a":"#ffec8a");}
  else if(i===6){cs=["#b07a00","#ffd23f","#fff6b0","#b07a00"];if((r+F)%12<2)cs=["#fff6b0","#fff","#fff","#fff6b0"];if(r%8===7)cs=["#8a5a00","#b07a00","#b07a00","#8a5a00"];}
  else if(i===7){const a=Math.floor(T*6);cs=[hc(a),"#07000f","#07000f",hc(a+4)];if((r+F)%6<2){cs[1]=hc(r+F);cs[2]=hc(r+F+3);}}
  if(hot)cs=W4;
  for(let c=0;c<4;c++)q(c,r,cs[c]);}
 if(i===6)for(let j=0;j<3;j++){const sr=(Math.floor(T*5)+j*9)%rows,sc=(j+F)%4;[[0,0],[0,-1],[0,1],[-1,0],[1,0]].forEach(d=>q(sc+d[0],sr+d[1],"#fff"));}
 if(i===7)for(let j=0;j<4;j++){const a=T*3+j*1.57;q(2+Math.cos(a)*3.5,rows/2+Math.sin(a)*rows*.45,hc(j*2+F));}
}
function emitSkin(dt){if(skin===0||tiltLock>0||Math.random()>dt*40)return;const a=Math.random,c=[0,"#cfe9ff","#ff9aeb","#d8b8ff","#aefcff",a()<.5?"#ffec8a":"#ff7a1a","#fff6b0","hsl("+(a()*360|0)+",100%,70%)"][skin];
 parts.push({x:34+a()*14,y:P.y+(a()-.5)*P.h,vx:skin===5?-30-a()*30:-20-a()*50,vy:skin===5?-90-a()*60:skin===1?40+a()*50:(a()-.5)*50,life:.5+a()*.4,max:.9,c});}
function drawSkins(){
 const now=performance.now(),dtc=Math.min(.05,(now-(drawSkins.t||now))/1000);drawSkins.t=now;carPos+=(view-carPos)*Math.min(1,dtc*9);
 panel();txt("SKINS",480,62,30,G,"center",HF);txt("COINS: "+sv.coins,480,98,24,AMB);
 {const kc=SK[view].c,o=sv.own.includes(view);ctx.save();ctx.fillStyle=kc;[[230,.05],[170,.06],[110,.07]].forEach(a=>{ctx.globalAlpha=o?a[1]:a[1]/3;ctx.fillRect(480-a[0],250-a[0],a[0]*2,a[0]*2);});ctx.globalAlpha=o?.5:.15;for(let k=0;k<8;k++)ctx.fillRect(400+k*20,354,12,6);ctx.restore();}
 SK.map((k,i)=>i).sort((p,q)=>Math.abs(q-carPos)-Math.abs(p-carPos)).forEach(i=>{const k=SK[i],d=i-carPos,ad=Math.abs(d);if(ad>2.3)return;
  const sc=Math.max(.3,1-.5*ad),x=480+d*230,own=sv.own.includes(i),w=34*sc,h=200*sc;
  ctx.save();ctx.globalAlpha=Math.max(.15,1-ad*.45);paddleFx(i,x,250,w,h,own,0,Math.max(2,Math.round(9*sc)));
  if(!own)txt("?",x,250,Math.round(56*sc),"#999","center",HF);ctx.restore();});
 const k=SK[view],own=sv.own.includes(view),eq=skin===view;
 txt(k.n,480,372,28,own?k.c:D,"center",HF);txt(k.ab,480,404,24,AMB);txt(k.d,480,430,20,"#b8ffcb");
 if(!own)txt("OR UNLOCK TROPHY: "+ACH.find(a=>a.id===k.ach).n,480,456,20,D);
 btn(eq?"EQUIPPED":own?"EQUIP":"BUY "+k.cost+" COINS",360,470,240,46,pick,!eq,24);
 btn("<",70,205,70,70,()=>go(-1),false,44);btn(">",820,205,70,70,()=>go(1),false,44);
 SK.forEach((q,i)=>{ctx.fillStyle=i===view?G:DK;ctx.fillRect(480-SK.length*10+i*20,546,10,10);});
 btn("BACK",50,522,140,44,()=>state="menu");btn("TROPHIES",770,522,140,44,()=>state="trophies",false,20);}
function drawTrophies(){panel();txt("TROPHIES",480,62,30,G,"center",HF);txt(Object.keys(sv.ach).length+" / "+ACH.length+"    COINS: "+sv.coins,480,98,22,AMB);
 ACH.forEach((a,i)=>{const x=50+(i%2)*440,y=114+Math.floor(i/2)*66,w=420,h=60,dn=sv.ach[a.id],sk=SK.find(q=>q.ach===a.id);
  ctx.fillStyle=dn?"rgba(255,210,63,.15)":"rgba(10,58,22,.5)";ctx.fillRect(x,y,w,h);ctx.strokeStyle=dn?AMB:D;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);
  txt(a.n,x+10,y+18,22,dn?AMB:G,"left");txt(a.d,x+10,y+43,20,"#b8ffcb","left");txt(dn?"DONE":sk?"+50 +SKIN":"+50",x+w-10,y+18,20,dn?AMB:D,"right");});
 btn("BACK",50,520,140,40,()=>state="menu");btn("SKINS",770,520,140,40,openSkins,false,20);}
let P,C,b,combo=0,ps=0,cs=0,tilt=100,nudgeCd=0,bumpers=[],targets=[],msg="",msgT=0,shake=0,cpu,winner="",best=0,bestEver=0,rallies=0,serveT=0,lastN=0,parts=[],trail=[],rings=[],pops=[],flashT=0,pHit=0,cHit=0;
try{bestEver=+localStorage.getItem("ppBest")||0;}catch(e){}
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),s:.2+Math.random()*.8}));
function start(){A();parts=[];trail=[];rings=[];pops=[];ps=0;cs=0;combo=0;best=0;rallies=0;tilt=100;nudgeCd=0;tiltLock=0;bmT=900;frz=mag=shield=blaze=jack=0;P={y:LH/2,h:CFG.ph};C={y:LH/2,h:CFG.ph};big={p:0,c:0};slow=0;hs=0;ev=null;evCd=30;CFG.ballMax=900;cpu={...CFG.diff[sel],t:0,ty:LH/2};layout();serve(Math.random()<.5?1:-1);state="play";paused=false;beep(660,.12);showTip("move","MOVE: MOUSE, W/S KEYS OR TOUCH");if(!mTimer)music();}
function layout(){const j=n=>(Math.random()-.5)*n;
 bumpers=[{x:480,y:165+j(30),r:34},{x:480,y:435+j(30),r:34},{x:360+j(30),y:300+j(40),r:28},{x:600+j(30),y:300+j(40),r:28}].map(o=>({...o,f:0}));
 targets=[60,238,362,540].map(y=>({x:480,y,r:13,lit:0,f:0}));}
function serve(dir){extras=[];if(ev){ev=null;evCd=20;}CFG.ballMax=900;bmT=900;frz=mag=shield=blaze=jack=0;b={x:LW/2,y:LH/2,vx:0,vy:0,r:9,dir};serveT=1.8;lastN=0;trail=[];}
// Shockwave: only hits balls that are inbound toward your paddle (multiballs included).
// Using it with less than 40 charge = overnudge = TILT: paddle locks briefly.
function nudge(){if(two||serveT>0||nudgeCd>0||tiltLock>0)return;
 if(tilt<40){tiltLock=1.3;tilt=20;msg="OVERLOAD!";msgT=1;shake=.3;beep(90,.4,"sawtooth",.1);return;}
 const d=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);let n=0;
 const ab=SK[skin].ab;if(ab==="SHOCKWAVE"){[b,...extras].forEach(q=>{if(q.x<300&&q.vx<0){q.vx=-q.vx*1.15;q.vy=-q.vy*1.15;sparks(q.x,q.y,16,320);n++;}});}else{n=1;if(ab==="FREEZE")frz=2;if(ab==="MAGNET")mag=1.5;if(ab==="SHIELD")shield=5;if(ab==="GROW")big.p=5;if(ab==="BLAZE")blaze=4;if(ab==="JACKPOT")jack=6;if(ab==="TIMEWARP")slow=3;}if(n){sv.uses=(sv.uses||0)+1;if(sv.uses>=20)grant("use20");save();}
 tilt-=40;nudgeCd=.4;pHit=.15;rings.push({x:40,y:P.y,r:20,life:.45});
 if(n){shake=.2;hs=.05;msg=ab+"!";msgT=.6;beep(180,.25,"sawtooth",.09);}else{msg="WHIFF";msgT=.4;beep(260,.08,"square",.05);}}

function predict(q){
 if(!cpu.sim){const t=(LW-40-q.x)/q.vx,y=q.y+q.vy*t,m=((y%(2*LH))+2*LH)%(2*LH);return m>LH?2*LH-m:m;}
 let x=q.x,y=q.y,vx=q.vx,vy=q.vy;const r=q.r,h=cpu.sim>1?1/120:1/60,ks=cpu.sim>1?bumpers.concat(targets):bumpers;
 for(let i=0;i<520&&x<LW-40;i++){
  x+=vx*h;y+=vy*h;
  if(y<r){y=r;vy=Math.abs(vy);}else if(y>LH-r){y=LH-r;vy=-Math.abs(vy);}
  for(const k of ks){const dx=x-k.x,dy=y-k.y,d=Math.hypot(dx,dy)||.01;if(d<k.r+r){const sp=Math.min(CFG.ballMax,Math.hypot(vx,vy)+CFG.bumpBoost);x=k.x+dx/d*(k.r+r+.5);y=k.y+dy/d*(k.r+r+.5);vx=dx/d*sp;vy=dy/d*sp;}}
  if(Math.abs(vx)<180){const sp0=Math.hypot(vx,vy);vx=180*(Math.sign(vx)||1);vy=Math.sign(vy||1)*Math.sqrt(Math.max(0,sp0*sp0-32400));}
  if(x<0)break;}
 return y;}
function updateCPU(dt){const k=combo>=10?.8:combo>=5?.9:1;cpu.t-=dt;
 if(cpu.t<=0){cpu.t=cpu.react*k;const slip=Math.random()<cpu.slip?3:1;
  let q=null,bt=1e9;[b,...extras].forEach(o=>{if(o.vx>0){const t=(LW-40-o.x)/o.vx;if(t<bt){bt=t;q=o;}}});
  cpu.ty=q?q.y+(predict(q)-q.y)*cpu.pred+(Math.random()-.5)*2*cpu.err*k*slip:LH/2;}
 const d=cpu.ty-C.y;C.y+=Math.sign(d)*Math.min(Math.abs(d),cpu.spd*dt);C.y=Math.max(C.h/2,Math.min(LH-C.h/2,C.y));}
