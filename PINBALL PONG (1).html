<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PINBALL PONG</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100vh;outline:none}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 160px rgba(0,0,0,.8)}
</style></head><body>
<canvas id="c" tabindex="0"></canvas><div id="scan"></div>
<script>
// ===== CONFIG =====
const LW=960,LH=600;
const CFG={WIN:50,pw:14,ph:110,pSpeed:580,ball0:420,ballMax:900,hitBoost:15,bumpBoost:36,
 diff:[{n:"EASY",react:.35,err:120,spd:300,pred:.3,slip:.25},{n:"MEDIUM",react:.22,err:84,spd:420,pred:.5,slip:.18},{n:"HARD",react:.14,err:48,spd:555,pred:.7,slip:.1}]};
const G="#39ff6a",D="#1a9a3c",DK="#0a3a16",AMB="#ffd23f";
const HF="'Press Start 2P',monospace",BF="Rajdhani,'Trebuchet MS',sans-serif";
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),scan=document.getElementById("scan");
let cw=0,ch=0,s=1,ox=0,oy=0,dpr=1;
function fit(){dpr=Math.min(2,window.devicePixelRatio||1);cw=innerWidth;ch=innerHeight;cv.width=cw*dpr;cv.height=ch*dpr;s=Math.min(cw/LW,ch/LH);ox=(cw-LW*s)/2;oy=(ch-LH*s)/2;}
addEventListener("resize",fit);fit();cv.focus();

// ===== AUDIO =====
let ac=null,mute=false,mTimer=null,st=0;
function A(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){}return ac;}
function beep(f,d=.08,t="square",v=.05){if(mute)return;const c=A();if(!c)return;const o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d);}
const SEQ=[220,277,330,277,220,277,330,440,196,247,294,247,196,247,294,392];
function music(){mTimer=setInterval(()=>{if(mute||paused||state!=="play")return;const f=SEQ[st%16]*(combo>=10?1.5:1);beep(f,.12,"triangle",.035);if(st%4===0)beep(f/4,.18,"square",.03);st++;},135);}

// ===== INPUT =====
const keys={};let state="menu",sel=1,paused=false,mouseY=null,ptr={x:-1,y:-1},ui=[];
function lp(e){return{x:(e.clientX-ox)/s,y:(e.clientY-oy)/s};}
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","Space","Enter","NumpadEnter"].includes(e.code))e.preventDefault();const f=!keys[e.code];keys[e.code]=true;if(f)press(e.code);});
addEventListener("keyup",e=>{keys[e.code]=false;});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;if(state==="play")paused=true;});
const isGo=c=>c==="Enter"||c==="NumpadEnter"||c==="Space";
function toMenu(){state="menu";paused=false;beep(220,.1);}
function press(c){
 if(c==="KeyM")mute=!mute;
 if(c==="KeyC")scan.style.display=scan.style.display==="none"?"block":"none";
 if(c==="KeyF")fs();
 if(state==="menu"){if(isGo(c))start();if(c==="KeyD"||c==="ArrowRight")sel=(sel+1)%3;if(c==="ArrowLeft")sel=(sel+2)%3;if(c==="KeyH")state="how";}
 else if(state==="how"){if(isGo(c)||c==="Escape"||c==="KeyQ")state="menu";}
 else if(state==="over"){if(isGo(c))start();if(c==="Escape"||c==="KeyQ")toMenu();}
 else if(state==="play"){if(c==="KeyQ")toMenu();else if(c==="Escape"||c==="KeyP")paused=!paused;else if(c==="Space"){paused?paused=false:nudge();}}
}
addEventListener("pointermove",e=>{ptr=lp(e);mouseY=ptr.y;});
cv.addEventListener("pointerdown",e=>{cv.focus();ptr=lp(e);mouseY=ptr.y;A();
 for(const u of ui)if(ptr.x>=u.x&&ptr.x<=u.x+u.w&&ptr.y>=u.y&&ptr.y<=u.y+u.h){u.fn();return;}
 if(state==="play"&&!paused)nudge();});

// ===== GAME STATE =====
let two=false,extras=[],hs=0,slow=0,big={p:0,c:0},lastHit="p",ev=null,evCd=30;
let P,C,b,combo=0,ps=0,cs=0,tilt=100,nudgeCd=0,bumpers=[],targets=[],msg="",msgT=0,shake=0,cpu,winner="",best=0,bestEver=0,rallies=0,serveT=0,lastN=0,parts=[],trail=[],rings=[],pops=[],flashT=0,pHit=0,cHit=0;
try{bestEver=+localStorage.getItem("ppBest")||0;}catch(e){}
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),s:.2+Math.random()*.8}));
function start(){A();parts=[];trail=[];rings=[];pops=[];ps=0;cs=0;combo=0;best=0;rallies=0;tilt=100;nudgeCd=0;P={y:LH/2,h:CFG.ph};C={y:LH/2,h:CFG.ph};big={p:0,c:0};slow=0;hs=0;ev=null;evCd=30;CFG.ballMax=900;cpu={...CFG.diff[sel],t:0,ty:LH/2};layout();serve(Math.random()<.5?1:-1);state="play";paused=false;beep(660,.12);if(!mTimer)music();}
function layout(){const j=n=>(Math.random()-.5)*n;
 bumpers=[{x:480,y:165+j(30),r:34},{x:480,y:435+j(30),r:34},{x:360+j(30),y:300+j(40),r:28},{x:600+j(30),y:300+j(40),r:28}].map(o=>({...o,f:0}));
 targets=[60,238,362,540].map(y=>({x:480,y,r:13,lit:0,f:0}));}
function serve(dir){extras=[];if(ev){ev=null;evCd=20;}CFG.ballMax=900;b={x:LW/2,y:LH/2,vx:0,vy:0,r:9,dir};serveT=1.8;lastN=0;trail=[];}
function nudge(){if(two||serveT>0||nudgeCd>0||tilt<40||b.x>300)return;const d=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);b.vx=Math.abs(b.vx)*1.25+80;b.vy+=d*380+(Math.random()-.5)*120;tilt-=40;nudgeCd=.4;pHit=.15;shake=.2;hs=.05;rings.push({x:40,y:P.y,r:20,life:.45});sparks(b.x,b.y,16,320);msg="SHOCKWAVE!";msgT=.6;beep(180,.25,"sawtooth",.09);}
function sparks(x,y,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.4+Math.random()*.3,max:.7});}}
function addCombo(n,x,y){if(ev&&ev.n==="FRENZY")n*=2;const old=combo;combo+=n;tilt=Math.min(100,tilt+n*3);if(combo>best)best=combo;pops.push({x,y,t:.7,s:"+"+n});
 if(Math.floor(combo/5)>Math.floor(old/5)){msg="COMBO x"+combo+"!";msgT=.9;flashT=.12;hs=.05;beep(880,.15,"triangle",.07);}if(Math.floor(combo/15)>Math.floor(old/15)&&extras.length<2&&!b.ex){extras.push({x:b.x,y:b.y,vx:-b.vx*.9,vy:b.vy||200,r:9,ex:1});msg="MULTIBALL!";msgT=1.2;beep(1200,.25,"triangle",.08);}if(combo>=10)shake=.12;}

// ===== CPU =====
function predict(){const t=(LW-40-b.x)/b.vx,y=b.y+b.vy*t,m=((y%(2*LH))+2*LH)%(2*LH);return m>LH?2*LH-m:m;}
function updateCPU(dt){const k=combo>=10?.8:combo>=5?.9:1;cpu.t-=dt;
 if(cpu.t<=0){cpu.t=cpu.react*k;const slip=Math.random()<cpu.slip?3:1;cpu.ty=b.vx>0?b.y+(predict()-b.y)*cpu.pred+(Math.random()-.5)*2*cpu.err*k*slip:LH/2;}
 const d=cpu.ty-C.y;C.y+=Math.sign(d)*Math.min(Math.abs(d),cpu.spd*dt);C.y=Math.max(C.h/2,Math.min(LH-C.h/2,C.y));}

// ===== PHYSICS =====
function hitPaddle(p,x,dir){if(b.vx*dir>=0)return;
 if(Math.abs(b.x-x)<=CFG.pw/2+b.r&&Math.abs(b.y-p.y)<=p.h/2+b.r){const off=Math.max(-1,Math.min(1,(b.y-p.y)/(p.h/2))),sp=Math.min(CFG.ballMax,Math.hypot(b.vx,b.vy)+CFG.hitBoost),a=off*.9;
  b.vx=dir*sp*Math.cos(a);b.vy=sp*Math.sin(a);b.x=x+dir*(CFG.pw/2+b.r+.5);beep(440,.06);sparks(b.x,b.y,8,240);if(dir>0)pHit=.15;else cHit=.15;lastHit=dir>0?"p":"c";rallies++;}}
function bounce(k){const dx=b.x-k.x,dy=b.y-k.y,d=Math.hypot(dx,dy)||.01;if(d>=k.r+b.r)return false;
 const nx=dx/d,ny=dy/d,sp=Math.min(CFG.ballMax,Math.hypot(b.vx,b.vy)+CFG.bumpBoost);b.x=k.x+nx*(k.r+b.r+.5);b.y=k.y+ny*(k.r+b.r+.5);b.vx=nx*sp;b.vy=ny*sp;k.f=.15;sparks(b.x,b.y,12,300);return true;}
function finish(){if(ps<CFG.WIN&&cs<CFG.WIN)return false;const w=ps>=CFG.WIN;winner=two?(w?"P1 WINS!":"P2 WINS!"):(w?"YOU WIN!":"CPU WINS");state="over";if(best>bestEver){bestEver=best;try{localStorage.setItem("ppBest",bestEver);}catch(e){}}return true;}
function score(){const pts=Math.max(1,combo)*(ev&&ev.n==="ROCKET BALL"?2:1),pl=b.x>LW;if(pl)ps+=pts;else cs+=pts;
 msg=(pl?(two?"P1":"YOU"):(two?"P2":"CPU"))+" +"+pts;msgT=1.3;flashT=.25;hs=.1;sparks(pl?LW-6:6,Math.max(10,Math.min(LH-10,b.y)),34,380);beep(pl?880:150,.3,"triangle",.09);
 if(finish())return;
 combo=0;layout();serve(pl?1:-1);}
function step(dt){if(ev&&ev.n==="GRAVITY"){bumpers.forEach(k=>{const dx=k.x-b.x,dy=k.y-b.y,d=Math.max(40,Math.hypot(dx,dy)),a=Math.min(2500,1.35e7/(d*d));b.vx+=dx/d*a*dt;b.vy+=dy/d*a*dt;});}
 const spd=Math.hypot(b.vx,b.vy),cap=CFG.ballMax*1.1;if(spd>cap){b.vx*=cap/spd;b.vy*=cap/spd;}
 b.x+=b.vx*dt;b.y+=b.vy*dt;const r=b.r;
 if(b.y<r){b.y=r;b.vy=Math.abs(b.vy);beep(200,.04);}
 if(b.y>LH-r){b.y=LH-r;b.vy=-Math.abs(b.vy);beep(200,.04);}
 hitPaddle(P,40,1);hitPaddle(C,LW-40,-1);
 bumpers.forEach(k=>{if(bounce(k)){addCombo(1,b.x,b.y);rings.push({x:k.x,y:k.y,r:k.r,life:.4});beep(300+Math.min(combo,20)*35,.09);}});
 targets.forEach(k=>{if(bounce(k)){beep(700,.08,"triangle");if(!k.lit){k.lit=1;addCombo(3,b.x,b.y);}
  if(targets.every(t=>t.lit)){addCombo(10,k.x,k.y);targets.forEach(t=>t.lit=0);if(Math.random()<.5){big[lastHit]=10;msg="BIG PADDLE!";}else{slow=6;msg="SLOW-MO!";}msgT=1.2;beep(1100,.2,"triangle",.08);}}});
 if(b.x<-20||b.x>LW+20){if(b.ex){b.dead=1;if(b.x>LW)ps+=5;else cs+=5;sparks(b.x>LW?LW-6:6,b.y,20,300);beep(660,.2,"triangle");msg="+5";msgT=.8;finish();}else score();}}
const EVS=[{n:"ROCKET BALL",t:6,c:"#ff7a1a"},{n:"GRAVITY",t:8,c:"#7ab8ff"},{n:"FRENZY",t:8,c:AMB}];
function startEv(){const e=EVS[Math.floor(Math.random()*EVS.length)];ev={...e,m:e.t};flashT=.2;hs=.08;beep(120,.4,"sawtooth",.08);if(ev.n==="ROCKET BALL"){CFG.ballMax=1500;b.vx*=1.7;b.vy*=1.7;}}
function endEv(){CFG.ballMax=900;ev=null;evCd=30;beep(200,.2);}
function update(dt){
 if(state!=="play"||paused)return;if(hs>0){hs-=dt;return;}if(slow>0){slow-=dt;dt*=.6;}big.p-=dt;big.c-=dt;P.h=CFG.ph*(big.p>0?1.6:1);C.h=CFG.ph*(big.c>0?1.6:1);
 let dir=0;if(keys.KeyW||(!two&&keys.ArrowUp))dir--;if(keys.KeyS||(!two&&keys.ArrowDown))dir++;
 if(dir){mouseY=null;P.y+=dir*CFG.pSpeed*dt;}else if(mouseY!==null&&!two){const d=mouseY-P.y;P.y+=Math.sign(d)*Math.min(Math.abs(d),CFG.pSpeed*1.6*dt);}
 P.y=Math.max(P.h/2,Math.min(LH-P.h/2,P.y));tilt=Math.min(100,tilt+3*dt);nudgeCd-=dt;if(two){let d2=0;if(keys.ArrowUp)d2--;if(keys.ArrowDown)d2++;C.y=Math.max(C.h/2,Math.min(LH-C.h/2,C.y+d2*CFG.pSpeed*dt));}else updateCPU(dt);
 if(serveT>0){serveT-=dt;const n=Math.ceil(serveT/.6);if(n!==lastN&&n>0){lastN=n;beep(520,.08);}if(serveT<=0){b.vx=b.dir*CFG.ball0;b.vy=(Math.random()-.5)*260;beep(880,.12);}}
 else{for(let i=0;i<3&&state==="play";i++){const m=b;extras.forEach(x=>{b=x;step(dt/3);});b=m;step(dt/3);}extras=extras.filter(x=>!x.dead);}
 if(serveT<=0){if(ev){ev.t-=dt;if(ev.t<=0)endEv();}else{evCd-=dt;if(evCd<=0)startEv();}}
 bumpers.forEach(k=>k.f=Math.max(0,k.f-dt));targets.forEach(k=>k.f=Math.max(0,k.f-dt));
 shake=Math.max(0,shake-dt);msgT-=dt;flashT=Math.max(0,flashT-dt);pHit=Math.max(0,pHit-dt);cHit=Math.max(0,cHit-dt);
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});parts=parts.filter(p=>p.life>0);
 rings.forEach(r=>{r.life-=dt;r.r+=240*dt;});rings=rings.filter(r=>r.life>0);
 pops.forEach(p=>{p.t-=dt;p.y-=60*dt;});pops=pops.filter(p=>p.t>0);
 trail.push({x:b.x,y:b.y});if(trail.length>16)trail.shift();}

// ===== RENDER =====
function txt(t,x,y,size,col,al="center",font=BF){ctx.font=font===HF?size+"px "+HF:"700 "+size+"px "+BF;ctx.textAlign=al;ctx.textBaseline="middle";ctx.fillStyle=col;ctx.fillText(t,x,y);}
const glow=(c,n)=>{ctx.shadowColor=c;ctx.shadowBlur=n;},noglow=()=>{ctx.shadowBlur=0;};
function btn(label,x,y,w,h,fn,primary,size=24){const hov=ptr.x>=x&&ptr.x<=x+w&&ptr.y>=y&&ptr.y<=y+h;ui.push({x,y,w,h,fn});
 ctx.save();glow(G,hov?24:10);ctx.fillStyle=primary||hov?G:"rgba(10,58,22,.8)";ctx.strokeStyle=G;ctx.lineWidth=3;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);ctx.restore();
 txt(label,x+w/2,y+h/2+2,size,primary||hov?"#021a08":G);}
function wave(t,x,y,size,col){const T=performance.now()/1000;ctx.font=size+"px "+HF;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=col;for(let i=0;i<t.length;i++)ctx.fillText(t[i],x-t.length*size/2+size*(i+.5),y+Math.sin(T*3+i*.7)*6);}
function bg(){const t=performance.now()/1000;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,cw,ch);
 const g=ctx.createRadialGradient(cw/2,ch/2,0,cw/2,ch/2,Math.max(cw,ch)*.7);g.addColorStop(0,"rgba(20,120,50,.28)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
 ctx.fillStyle=DK;ctx.globalAlpha=.7;const gs=48*s;for(let x=ox%gs;x<cw;x+=gs)ctx.fillRect(x,0,1,ch);const o=(t*20)%gs;for(let y=-gs+o;y<ch;y+=gs)ctx.fillRect(0,y,cw,1);ctx.globalAlpha=1;
 stars.forEach(q=>{const x=((q.x*cw-t*q.s*30)%cw+cw)%cw,big=q.s>.7;ctx.fillStyle=big?D:DK;ctx.fillRect(Math.round(x),Math.round(q.y*ch),big?3:2,big?3:2);});}
function drawMenu(){const t=performance.now()/1000;
 glow(G,16);ctx.fillStyle=G;ctx.fillRect(480+Math.sin(t*1.3)*420-9,300+Math.sin(t*1.9)*250-9,18,18);noglow();
 glow(G,20);wave("PINBALL",480,100,72,G);wave("PONG",480,190,72,G);noglow();
 btn("PLAY",310,252,340,56,start,true,30);btn("MODE: "+(two?"2 PLAYERS":"VS CPU"),310,316,340,50,()=>two=!two);
 btn("DIFFICULTY: "+CFG.diff[sel].n,310,372,340,50,()=>sel=(sel+1)%3);
 btn("HOW TO PLAY",310,428,340,50,()=>state="how");
 btn("SOUND: "+(mute?"OFF":"ON"),310,484,340,50,()=>mute=!mute);
 txt("BEST COMBO: "+bestEver,480,552,22,AMB);
 txt("ENTER: PLAY    D: DIFFICULTY    H: HELP    F: FULLSCREEN",480,580,18,D);}
function drawHow(){
 ctx.fillStyle="rgba(0,12,4,.75)";ctx.fillRect(60,40,840,520);glow(G,14);ctx.strokeStyle=G;ctx.lineWidth=3;ctx.strokeRect(60,40,840,520);noglow();
 txt("HOW TO PLAY",480,95,34,G,"center",HF);
 const L=[["MOVE","W/S, ARROWS, MOUSE, TOUCH  (2P: P1 W/S, P2 ARROWS)"],["SHOCK","SPACE/CLICK: shockwave (charged by combo hits)"],["PAUSE","P or ESC"],["QUIT","Q   (also MUTE: M   FULLSCREEN: F   SCANLINES: C)"]];
 L.forEach((r,i)=>{txt(r[0],110,160+i*38,24,AMB,"left");txt(r[1],230,160+i*38,24,G,"left");});
 ["Bumpers give +1 to the COMBO. Targets give +3.","All 4 targets: +10 and a power-up. Combo 15: MULTIBALL!","If the ball gets past a paddle, the other side","scores the whole COMBO (at least 1 point).","Every 30s a random EVENT hits! First to "+CFG.WIN+" wins."].forEach((l,i)=>txt(l,480,350+i*36,24,i===4?AMB:"#b8ffcb"));
 btn("BACK",380,498,200,48,()=>state="menu",true);}
function drawBumper(k){const T=performance.now()/1000,c=ev&&ev.n==="FRENZY"?AMB:G,am=c===AMB,f=k.f>0,r=k.r*(1+k.f*1.2);
 if(ev&&ev.n==="GRAVITY"){for(let i=0;i<3;i++){const p=(T*.8+i/3)%1;ctx.globalAlpha=p*.5;ctx.strokeStyle="#7ab8ff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(k.x,k.y,k.r+120*(1-p),0,7);ctx.stroke();}ctx.globalAlpha=1;}
 glow(c,f?40:16);ctx.beginPath();ctx.arc(k.x,k.y,r+3,0,7);ctx.fillStyle="#031a09";ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=c;ctx.stroke();noglow();
 ctx.save();ctx.translate(k.x,k.y);ctx.rotate(T*(f?6:1.2));ctx.setLineDash([k.r*.55,k.r*.4]);ctx.lineWidth=3;ctx.strokeStyle=c;ctx.beginPath();ctx.arc(0,0,r-4,0,7);ctx.stroke();ctx.restore();
 const g=ctx.createRadialGradient(k.x-r*.3,k.y-r*.35,r*.1,k.x,k.y,r*.8);g.addColorStop(0,f?"#fff":am?"#ffe9a0":"#b8ffcb");g.addColorStop(.45,f?c:am?"#e0a800":"#1fbf4a");g.addColorStop(1,f?c:am?"#6a4a00":"#0a5a1f");
 ctx.beginPath();ctx.arc(k.x,k.y,r*.62,0,7);ctx.fillStyle=g;ctx.fill();ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.ellipse(k.x-r*.2,k.y-r*.28,r*.16,r*.1,-.6,0,7);ctx.fill();}
function drawBall(q){const sp=Math.hypot(q.vx,q.vy),L=Math.max(0,(sp-500)*.08);if(L>0){ctx.globalAlpha=.5;ctx.strokeStyle=ev&&ev.n==="ROCKET BALL"?"#ff7a1a":G;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx/sp*L,q.y-q.vy/sp*L);ctx.stroke();ctx.globalAlpha=1;}ctx.fillStyle=ev&&ev.n==="ROCKET BALL"?"#ffd0a0":"#d8ffe2";ctx.fillRect(q.x-9,q.y-9,18,18);}
function drawPlay(){
 ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*10,(Math.random()-.5)*10);
 ctx.fillStyle="rgba(0,12,4,.6)";ctx.fillRect(0,0,LW,LH);glow(G,16);ctx.strokeStyle=D;ctx.lineWidth=4;ctx.strokeRect(2,2,LW-4,LH-4);noglow();
 ctx.fillStyle=D;for(let y=10;y<LH;y+=36)ctx.fillRect(LW/2-3,y,6,18);
 if(combo>0)txt(String(combo),LW/2,LH/2+20,200+Math.min(combo,20)*4,"rgba(57,255,106,.10)","center",HF);
 rings.forEach(r=>{ctx.globalAlpha=Math.max(0,r.life/.4);ctx.strokeStyle=G;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();});ctx.globalAlpha=1;
 bumpers.forEach(drawBumper);
 targets.forEach(k=>{ctx.beginPath();ctx.arc(k.x,k.y,k.r,0,7);glow(AMB,k.lit||k.f>0?22:0);ctx.fillStyle=k.lit?AMB:"rgba(255,210,63,.12)";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=AMB;ctx.stroke();noglow();});
 trail.forEach((p,i)=>{const a=i/trail.length;ctx.globalAlpha=a*.6;ctx.fillStyle=ev&&ev.n==="ROCKET BALL"?"#ff7a1a":G;const z=Math.max(2,a*(ev&&ev.n==="ROCKET BALL"?26:16));ctx.fillRect(p.x-z/2,p.y-z/2,z,z);});ctx.globalAlpha=1;
 glow(G,18);ctx.fillStyle=pHit>0?"#d8ffe2":G;ctx.fillRect(40-CFG.pw/2-pHit*30,P.y-P.h/2,CFG.pw+pHit*60,P.h);ctx.fillStyle=cHit>0?"#d8ffe2":G;ctx.fillRect(LW-40-CFG.pw/2-cHit*30,C.y-C.h/2,CFG.pw+cHit*60,C.h);
 drawBall(b);extras.forEach(drawBall);noglow();
 parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=G;ctx.fillRect(p.x,p.y,5,5);});ctx.globalAlpha=1;
 pops.forEach(p=>{ctx.globalAlpha=Math.min(1,p.t*2);txt(p.s,p.x,p.y,30,AMB);});ctx.globalAlpha=1;
 txt(two?"P1":"YOU",200,26,22,D);txt(String(ps),200,64,44,G,"center",HF);
 txt(two?"P2":"CPU ("+CFG.diff[sel].n+")",760,26,22,D);txt(String(cs),760,64,44,G,"center",HF);
 txt("COMBO",480,26,22,D);txt("x"+combo,480,64,38,combo>=5?AMB:G,"center",HF);
 if(ev){glow(ev.c,18);txt("EVENT: "+ev.n,480,112,22,ev.c,"center",HF);noglow();ctx.fillStyle=ev.c;ctx.fillRect(330,128,300*Math.max(0,ev.t/ev.m),6);}else if(evCd<10&&serveT<=0&&state==="play")txt("EVENT IN "+Math.ceil(evCd),480,104,22,AMB);
 if(!two){txt("TILT",24,LH-28,22,D,"left");ctx.strokeStyle=D;ctx.lineWidth=2;ctx.strokeRect(84,LH-38,180,18);ctx.fillStyle=tilt<40?D:AMB;ctx.fillRect(86,LH-36,Math.max(0,tilt*1.76),14);if(tilt>=40)txt("SPACE: SHOCKWAVE",276,LH-28,20,AMB,"left");}
 if(state==="play"&&!paused){btn("PAUSE",LW-270,LH-52,120,40,()=>paused=true,false,20);btn("QUIT",LW-140,LH-52,110,40,toMenu,false,20);}
 if(msgT>0){ctx.globalAlpha=Math.min(1,msgT*2);glow(G,16);txt(msg,480,235,30,G,"center",HF);noglow();ctx.globalAlpha=1;}
 if(serveT>0&&state==="play")txt(String(Math.ceil(serveT/.6)),480,380,80,AMB,"center",HF);
 if(slow>0){ctx.fillStyle="rgba(80,160,255,.08)";ctx.fillRect(0,0,LW,LH);}
 if(flashT>0){ctx.globalAlpha=Math.min(.3,flashT*1.2);ctx.fillStyle=G;ctx.fillRect(0,0,LW,LH);ctx.globalAlpha=1;}
 ctx.restore();}
function drawPause(){ui=[];ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(0,0,LW,LH);glow(G,16);txt("PAUSED",480,150,48,G,"center",HF);noglow();
 btn("RESUME",330,240,300,56,()=>paused=false,true,28);btn("RESTART",330,312,300,56,start);btn("QUIT TO MENU",330,384,300,56,toMenu);}
function drawOver(){ui=[];ctx.fillStyle="rgba(0,0,0,.75)";ctx.fillRect(0,0,LW,LH);glow(G,20);txt(winner,480,140,50,G,"center",HF);noglow();
 txt("FINAL SCORE  "+ps+" - "+cs,480,225,32,"#b8ffcb");txt("BEST COMBO "+best+"    RECORD "+bestEver+"    RALLY HITS "+rallies,480,270,24,AMB);
 btn("PLAY AGAIN",330,330,300,56,start,true,28);btn("MENU",330,402,300,56,toMenu);}
function draw(){ui=[];bg();ctx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);
 if(state==="menu")drawMenu();else if(state==="how")drawHow();else{drawPlay();if(paused)drawPause();if(state==="over")drawOver();}
 ctx.setTransform(dpr,0,0,dpr,0,0);}
let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
